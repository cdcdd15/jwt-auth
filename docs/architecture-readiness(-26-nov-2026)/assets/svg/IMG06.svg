<svg xmlns="http://www.w3.org/2000/svg" width="760" height="345" viewBox="0 0 760 345"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#243247"><text x="380" y="28" text-anchor="middle" font-size="20" font-weight="bold">Resource allocation</text><rect x="40" y="55" width="680" height="120" rx="12" fill="#16a34a" fill-opacity=".07" stroke="#16a34a"/><text x="380" y="80" text-anchor="middle" font-weight="bold" font-size="17">Required</text><text x="380" y="103" text-anchor="middle" font-size="15">Java / Spring Boot runtime, Spring Security, Nimbus JOSE</text><text x="380" y="127" text-anchor="middle" font-size="15">RSA public key, REST API, security configuration</text><text x="380" y="151" text-anchor="middle" font-size="15">Unit and integration tests, CI/CD, logging, test token source</text><path d="M380 175 V195 l-5 -7 m5 7 l5 -7" stroke="#64748b" fill="none"/><rect x="40" y="200" width="680" height="120" rx="12" fill="#64748b" fill-opacity=".07" stroke="#64748b"/><text x="380" y="225" text-anchor="middle" font-weight="bold" font-size="17">Not required initially</text><text x="380" y="248" text-anchor="middle" font-size="15">PostgreSQL / Oracle, Hibernate / JPA, migrations, Redis, Kafka</text><text x="380" y="272" text-anchor="middle" font-size="15">User management, sessions, OAuth2 authorization server</text><text x="380" y="296" text-anchor="middle" font-size="15">Login UI, token generation module</text></g></svg>