<svg xmlns="http://www.w3.org/2000/svg" width="940" height="350" viewBox="0 0 940 350" role="img" aria-labelledby="title description">
  <title id="title">P3 actor responsibilities</title>
  <desc id="description">The client requests a token from the issuer. The issuer returns a signed JWT and supplies public verification keys to the resource server. The client presents the JWT to the resource server, which verifies it and enforces API permissions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="940" height="350" fill="white"/>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#243247">
    <text x="470" y="35" font-size="22" font-weight="bold">P3 actor responsibilities</text>
    <rect x="24" y="100" width="218" height="133" rx="12" fill="#2563eb" fill-opacity=".08" stroke="#2563eb"/>
    <rect x="361" y="100" width="218" height="133" rx="12" fill="#d97706" fill-opacity=".08" stroke="#d97706"/>
    <rect x="698" y="100" width="218" height="133" rx="12" fill="#16a34a" fill-opacity=".08" stroke="#16a34a"/>
    <g font-size="18" font-weight="bold">
      <text x="133" y="130">Client</text>
      <text x="470" y="130">JWT Issuer</text>
      <text x="807" y="130">JWT Resource Server</text>
    </g>
    <g font-size="14">
      <text x="133" y="161">Obtain a token</text>
      <text x="133" y="184">Call the protected API</text>
      <text x="470" y="161">Establish identity and roles</text>
      <text x="470" y="184">Sign with the private key</text>
      <text x="470" y="207">Supply public keys and contract</text>
      <text x="807" y="161">Verify signature and claims</text>
      <text x="807" y="184">Map roles to authorities</text>
      <text x="807" y="207">Enforce endpoint policy</text>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)">
      <path d="M242 151 H359"/>
      <path d="M361 195 H244"/>
      <path d="M579 151 H696" stroke-dasharray="5 4"/>
      <path d="M133 233 V292 H807 V235"/>
    </g>
    <g font-size="12">
      <text x="301" y="143">Token request</text>
      <text x="301" y="187">Signed JWT</text>
      <text x="638" y="143">Public key / JWKS</text>
      <text x="470" y="316" font-size="14">Protected API request with bearer JWT</text>
    </g>
  </g>
</svg>
