<svg xmlns="http://www.w3.org/2000/svg" width="760" height="443" viewBox="0 0 760 443"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#243247"><text x="380" y="28" text-anchor="middle" font-size="20" font-weight="bold">Cryptographic learning milestones</text><rect x="40" y="55" width="680" height="72" rx="12" fill="#64748b" fill-opacity=".07" stroke="#64748b"/><text x="380" y="80" text-anchor="middle" font-weight="bold" font-size="17">P1 — RS256 + static PEM</text><text x="380" y="103" text-anchor="middle" font-size="15">Understand signing and validation</text><path d="M380 127 V147 l-5 -7 m5 7 l5 -7" stroke="#64748b" fill="none"/><rect x="40" y="152" width="680" height="72" rx="12" fill="#64748b" fill-opacity=".07" stroke="#64748b"/><text x="380" y="177" text-anchor="middle" font-weight="bold" font-size="17">P2 — RS256 + static JWK</text><text x="380" y="200" text-anchor="middle" font-size="15">Key representation and identifiers</text><path d="M380 224 V244 l-5 -7 m5 7 l5 -7" stroke="#64748b" fill="none"/><rect x="40" y="249" width="680" height="72" rx="12" fill="#2563eb" fill-opacity=".07" stroke="#2563eb"/><text x="380" y="274" text-anchor="middle" font-weight="bold" font-size="17">P3 — RS256 + remote JWKS</text><text x="380" y="297" text-anchor="middle" font-size="15">External dependencies, HTTPS and caching</text><path d="M380 321 V341 l-5 -7 m5 7 l5 -7" stroke="#64748b" fill="none"/><rect x="40" y="346" width="680" height="72" rx="12" fill="#16a34a" fill-opacity=".07" stroke="#16a34a"/><text x="380" y="371" text-anchor="middle" font-weight="bold" font-size="17">P4 — Enterprise key lifecycle</text><text x="380" y="394" text-anchor="middle" font-size="15">Rotation, resilience, certificate trust and failures</text></g></svg>