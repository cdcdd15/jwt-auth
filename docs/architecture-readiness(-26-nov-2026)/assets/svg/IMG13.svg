<svg xmlns="http://www.w3.org/2000/svg" width="760" height="345" viewBox="0 0 760 345"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#243247"><text x="380" y="28" text-anchor="middle" font-size="20" font-weight="bold">Two principal stakeholder deliverables</text><rect x="40" y="55" width="680" height="120" rx="12" fill="#2563eb" fill-opacity=".07" stroke="#2563eb"/><text x="380" y="80" text-anchor="middle" font-weight="bold" font-size="17">1. Architecture assumptions and hypotheses</text><text x="380" y="103" text-anchor="middle" font-size="15">System boundaries, scope and responsibilities</text><text x="380" y="127" text-anchor="middle" font-size="15">Security model, constraints, exclusions</text><text x="380" y="151" text-anchor="middle" font-size="15">Accepted limitations, architecture decisions</text><path d="M380 175 V195 l-5 -7 m5 7 l5 -7" stroke="#64748b" fill="none"/><rect x="40" y="200" width="680" height="120" rx="12" fill="#16a34a" fill-opacity=".07" stroke="#16a34a"/><text x="380" y="225" text-anchor="middle" font-weight="bold" font-size="17">2. Prerequisites and dependencies</text><text x="380" y="248" text-anchor="middle" font-size="15">External contracts, software and Maven dependencies</text><text x="380" y="272" text-anchor="middle" font-size="15">Trust material, connectivity, certificates and truststores</text><text x="380" y="296" text-anchor="middle" font-size="15">Infrastructure, permissions, testing resources</text></g></svg>