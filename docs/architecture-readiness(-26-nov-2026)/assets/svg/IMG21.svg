<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title description">
  <title id="title">X.509 certificates for HTTPS and JWT signing</title>
  <desc id="description">The HTTPS path uses an X.509 server certificate to authenticate the endpoint. The JWT path uses a trusted issuer public key, which can optionally be carried in a separate X.509 signing certificate.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="white"/>
  <g font-family="Arial,sans-serif" fill="#243247" text-anchor="middle">
    <text x="380" y="29" font-size="20" font-weight="bold">X.509 certificates for HTTPS and JWT signing</text>
    <text x="200" y="69" font-size="17" font-weight="bold">HTTPS server authentication</text>
    <text x="560" y="69" font-size="17" font-weight="bold">JWT signature verification</text>
    <rect x="40" y="88" width="320" height="68" rx="12" fill="#2563eb" fill-opacity=".10" stroke="#2563eb" stroke-width="2"/>
    <text x="200" y="115" font-size="16" font-weight="bold">X.509 TLS server certificate</text>
    <text x="200" y="137" font-size="14">DNS identity and TLS public key</text>
    <rect x="400" y="88" width="320" height="68" rx="12" fill="#d97706" fill-opacity=".07" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="560" y="115" font-size="16" font-weight="bold">Optional X.509 signing certificate</text>
    <text x="560" y="137" font-size="14">Can carry the issuer’s signing public key</text>
    <path d="M200 156 V195" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
    <path d="M560 156 V195" fill="none" stroke="#64748b" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <rect x="40" y="197" width="320" height="65" rx="12" fill="#2563eb" fill-opacity=".06" stroke="#2563eb"/>
    <text x="200" y="223" font-size="16" font-weight="bold">HTTPS client validates certificate</text>
    <text x="200" y="245" font-size="14">Trust chain, hostname and validity dates</text>
    <rect x="400" y="197" width="320" height="65" rx="12" fill="#d97706" fill-opacity=".07" stroke="#d97706"/>
    <text x="560" y="223" font-size="16" font-weight="bold">Trusted issuer signing public key</text>
    <text x="560" y="245" font-size="14">PEM, JWK from JWKS, or certificate</text>
    <path d="M200 262 V298" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
    <path d="M560 262 V298" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
    <rect x="40" y="300" width="320" height="49" rx="12" fill="#16a34a" fill-opacity=".07" stroke="#16a34a"/>
    <text x="200" y="330" font-size="15" font-weight="bold">TLS protects the HTTP connection</text>
    <rect x="400" y="300" width="320" height="49" rx="12" fill="#16a34a" fill-opacity=".07" stroke="#16a34a"/>
    <text x="560" y="330" font-size="15" font-weight="bold">API verifies the JWT signature</text>
  </g>
</svg>
