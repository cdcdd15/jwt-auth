<svg xmlns="http://www.w3.org/2000/svg" width="760" height="418" viewBox="0 0 760 418"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#243247"><text x="380" y="28" text-anchor="middle" font-size="20" font-weight="bold">RSA key rotation lifecycle</text><rect x="40" y="55" width="680" height="96" rx="12" fill="#16a34a" fill-opacity=".07" stroke="#16a34a"/><text x="380" y="80" text-anchor="middle" font-weight="bold" font-size="17">Initial</text><text x="380" y="103" text-anchor="middle" font-size="15">Key 01: sign + verify</text><text x="380" y="127" text-anchor="middle" font-size="15">JWKS: Key 01</text><path d="M380 151 V171 l-5 -7 m5 7 l5 -7" stroke="#64748b" fill="none"/><rect x="40" y="176" width="680" height="96" rx="12" fill="#d97706" fill-opacity=".07" stroke="#d97706"/><text x="380" y="201" text-anchor="middle" font-weight="bold" font-size="17">Transition</text><text x="380" y="224" text-anchor="middle" font-size="15">Key 01: verify only; Key 02: sign + verify</text><text x="380" y="248" text-anchor="middle" font-size="15">JWKS: Key 01 + 02</text><path d="M380 272 V292 l-5 -7 m5 7 l5 -7" stroke="#64748b" fill="none"/><rect x="40" y="297" width="680" height="96" rx="12" fill="#16a34a" fill-opacity=".07" stroke="#16a34a"/><text x="380" y="322" text-anchor="middle" font-weight="bold" font-size="17">Completed</text><text x="380" y="345" text-anchor="middle" font-size="15">Key 01 retired; Key 02: sign + verify</text><text x="380" y="369" text-anchor="middle" font-size="15">JWKS: Key 02</text></g></svg>