<svg xmlns="http://www.w3.org/2000/svg" width="760" height="612" viewBox="0 0 760 612"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#243247"><text x="380" y="28" text-anchor="middle" font-size="20" font-weight="bold">Cryptographic trust architecture</text><rect x="40" y="55" width="680" height="96" rx="12" fill="#64748b" fill-opacity=".07" stroke="#64748b"/><text x="380" y="80" text-anchor="middle" font-weight="bold" font-size="17">OUT OF SCOPE — jwt-issuer</text><text x="380" y="103" text-anchor="middle" font-size="15">RSA private key, RSA public key</text><text x="380" y="127" text-anchor="middle" font-size="15">RS256 signing</text><path d="M380 151 V171 l-5 -7 m5 7 l5 -7" stroke="#64748b" fill="none"/><rect x="40" y="176" width="680" height="96" rx="12" fill="#2563eb" fill-opacity=".07" stroke="#2563eb"/><text x="380" y="201" text-anchor="middle" font-weight="bold" font-size="17">KEY DISTRIBUTION</text><text x="380" y="224" text-anchor="middle" font-size="15">Static PEM / JWK or remote JWKS endpoint</text><text x="380" y="248" text-anchor="middle" font-size="15">HTTPS + TLS certificates for remote retrieval</text><path d="M380 272 V292 l-5 -7 m5 7 l5 -7" stroke="#64748b" fill="none"/><rect x="40" y="297" width="680" height="96" rx="12" fill="#16a34a" fill-opacity=".07" stroke="#16a34a"/><text x="380" y="322" text-anchor="middle" font-weight="bold" font-size="17">IN SCOPE — jwt-resource-server</text><text x="380" y="345" text-anchor="middle" font-size="15">Trusted public key, public key / JWK cache</text><text x="380" y="369" text-anchor="middle" font-size="15">RS256 verification</text><path d="M380 393 V413 l-5 -7 m5 7 l5 -7" stroke="#64748b" fill="none"/><rect x="40" y="418" width="680" height="72" rx="12" fill="#64748b" fill-opacity=".07" stroke="#64748b"/><text x="380" y="443" text-anchor="middle" font-weight="bold" font-size="17">Client → protected REST API</text><text x="380" y="466" text-anchor="middle" font-size="15">Bearer JWT over HTTPS</text><path d="M380 490 V510 l-5 -7 m5 7 l5 -7" stroke="#64748b" fill="none"/><rect x="40" y="515" width="680" height="72" rx="12" fill="#d97706" fill-opacity=".07" stroke="#d97706"/><text x="380" y="540" text-anchor="middle" font-weight="bold" font-size="17">TRANSPORT SECURITY</text><text x="380" y="563" text-anchor="middle" font-size="15">TLS certificates, trusted CAs and encrypted connections</text></g></svg>