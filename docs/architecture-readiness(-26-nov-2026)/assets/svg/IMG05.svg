<svg xmlns="http://www.w3.org/2000/svg" width="760" height="467" viewBox="0 0 760 467"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#243247"><text x="380" y="28" text-anchor="middle" font-size="20" font-weight="bold">Dependency classification</text><rect x="40" y="55" width="680" height="96" rx="12" fill="#64748b" fill-opacity=".07" stroke="#64748b"/><text x="380" y="80" text-anchor="middle" font-weight="bold" font-size="17">Runtime dependencies</text><text x="380" y="103" text-anchor="middle" font-size="15">JVM, Spring Security, Nimbus JOSE, trusted public key</text><text x="380" y="127" text-anchor="middle" font-size="15">System clock and security configuration</text><path d="M380 151 V171 l-5 -7 m5 7 l5 -7" stroke="#64748b" fill="none"/><rect x="40" y="176" width="680" height="72" rx="12" fill="#2563eb" fill-opacity=".07" stroke="#2563eb"/><text x="380" y="201" text-anchor="middle" font-weight="bold" font-size="17">Contract dependencies</text><text x="380" y="224" text-anchor="middle" font-size="15">JWT structure, issuer, audience, algorithm, authorities</text><path d="M380 248 V268 l-5 -7 m5 7 l5 -7" stroke="#64748b" fill="none"/><rect x="40" y="273" width="680" height="72" rx="12" fill="#d97706" fill-opacity=".07" stroke="#d97706"/><text x="380" y="298" text-anchor="middle" font-weight="bold" font-size="17">Conditional network dependencies</text><text x="380" y="321" text-anchor="middle" font-size="15">JWKS endpoint, centralized logging, monitoring, TLS</text><path d="M380 345 V365 l-5 -7 m5 7 l5 -7" stroke="#64748b" fill="none"/><rect x="40" y="370" width="680" height="72" rx="12" fill="#64748b" fill-opacity=".07" stroke="#64748b"/><text x="380" y="395" text-anchor="middle" font-weight="bold" font-size="17">Excluded dependencies</text><text x="380" y="418" text-anchor="middle" font-size="15">User/business DB, Redis, session store, token introspection</text></g></svg>