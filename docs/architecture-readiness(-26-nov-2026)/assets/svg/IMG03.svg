<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 270" width="340" height="270"><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#202123"><rect x="5" y="5" width="330" height="255" rx="6" fill="#64748b" fill-opacity=".08" stroke="#64748b"/><text x="170" y="25" text-anchor="middle" font-size="13" font-weight="600" fill="#202123">jwt-issuer</text><text x="170" y="40" text-anchor="middle" font-size="10" font-weight="400" fill="#202123">Stateful user repository, stateless token issuance</text><text x="170" y="56" text-anchor="middle" font-size="10" font-weight="400" fill="#202123">• In-memory users</text><text x="170" y="70" text-anchor="middle" font-size="10" font-weight="400" fill="#202123">• Username/password authentication</text><text x="170" y="84" text-anchor="middle" font-size="10" font-weight="400" fill="#202123">• RSA private key</text><text x="170" y="98" text-anchor="middle" font-size="10" font-weight="400" fill="#202123">• JWT generation using Nimbus</text><text x="170" y="145" text-anchor="middle" font-size="13" font-weight="600" fill="#202123">jwt-resource-server</text><text x="170" y="160" text-anchor="middle" font-size="10" font-weight="400" fill="#202123">Stateless authentication</text><text x="170" y="176" text-anchor="middle" font-size="10" font-weight="400" fill="#202123">• No user repository</text><text x="170" y="190" text-anchor="middle" font-size="10" font-weight="400" fill="#202123">• No database</text><text x="170" y="204" text-anchor="middle" font-size="10" font-weight="400" fill="#202123">• RSA public key</text><text x="170" y="218" text-anchor="middle" font-size="10" font-weight="400" fill="#202123">• JWT validation using Nimbus</text><text x="170" y="232" text-anchor="middle" font-size="10" font-weight="400" fill="#202123">• Issuer, audience and timestamp validation</text><text x="170" y="246" text-anchor="middle" font-size="10" font-weight="400" fill="#202123">• Scope/role-based authorization</text><path d="M15 128 H325" fill="none" stroke="#64748b" stroke-width="1.3"/></g></svg>