<svg xmlns="http://www.w3.org/2000/svg" width="760" height="321" viewBox="0 0 760 321"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#243247"><text x="380" y="28" text-anchor="middle" font-size="20" font-weight="bold">JWT signing keys vs TLS certificates</text><rect x="40" y="55" width="680" height="96" rx="12" fill="#2563eb" fill-opacity=".07" stroke="#2563eb"/><text x="380" y="80" text-anchor="middle" font-weight="bold" font-size="17">JWT signing keys — application-level security</text><text x="380" y="103" text-anchor="middle" font-size="15">Sign JWT, verify authenticity</text><text x="380" y="127" text-anchor="middle" font-size="15">PEM or JWKS; X.509 optional; issuer manages</text><path d="M380 151 V171 l-5 -7 m5 7 l5 -7" stroke="#64748b" fill="none"/><rect x="40" y="176" width="680" height="120" rx="12" fill="#16a34a" fill-opacity=".07" stroke="#16a34a"/><text x="380" y="201" text-anchor="middle" font-weight="bold" font-size="17">TLS keys and certificates — transport-level security</text><text x="380" y="224" text-anchor="middle" font-size="15">Authenticate HTTPS servers; secure connections</text><text x="380" y="248" text-anchor="middle" font-size="15">X.509 for conventional HTTPS; trusted CAs</text><text x="380" y="272" text-anchor="middle" font-size="15">Infrastructure or application team manages</text></g></svg>