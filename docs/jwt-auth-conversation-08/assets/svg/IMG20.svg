<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360"><rect width="700" height="360" fill="white"/><rect x="25" y="12" width="650" height="60" rx="9" fill="#f5f7fa" stroke="#94a3b8"/><text x="350" y="35" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#263344">RSA signing public keys</text><text x="350" y="50" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#263344">Obtained from the trusted JWKS endpoint. Used for JWT signature verification.</text><rect x="25" y="92" width="650" height="75" rx="9" fill="#f5f7fa" stroke="#94a3b8"/><text x="350" y="115" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#263344">Trusted CA certificates</text><text x="350" y="130" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#263344">Available through the JVM truststore or a dedicated truststore.</text><text x="350" y="145" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#263344">Used to authenticate the remote JWKS HTTPS endpoint.</text><rect x="25" y="187" width="650" height="60" rx="9" fill="#f5f7fa" stroke="#94a3b8"/><text x="350" y="210" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#263344">Application TLS certificate and private key</text><text x="350" y="225" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#263344">Conditional. Required for TLS termination or mTLS authentication.</text><rect x="25" y="267" width="650" height="60" rx="9" fill="#f5f7fa" stroke="#94a3b8"/><text x="350" y="290" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#263344">JWT signing private key</text><text x="350" y="305" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#263344">Explicitly excluded. Must never be provided to the Resource Server.</text></svg>