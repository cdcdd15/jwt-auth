<svg xmlns="http://www.w3.org/2000/svg" width="700" height="215" viewBox="0 0 700 215"><rect width="700" height="215" fill="white"/><rect x="25" y="12" width="650" height="75" rx="9" fill="#f5f7fa" stroke="#94a3b8"/><text x="350" y="35" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#263344">Keystore — Who am I?</text><text x="350" y="50" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#263344">Own private key; own certificate; certificate chain</text><text x="350" y="65" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#263344">Used when our application needs to authenticate itself to another party.</text><rect x="25" y="107" width="650" height="75" rx="9" fill="#f5f7fa" stroke="#94a3b8"/><text x="350" y="130" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#263344">Truststore — Whom do I trust?</text><text x="350" y="145" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#263344">Trusted CA certificates; trusted peer certificates</text><text x="350" y="160" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#263344">Used when our application needs to authenticate another party.</text></svg>