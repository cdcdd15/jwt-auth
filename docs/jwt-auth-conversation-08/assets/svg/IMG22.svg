<svg xmlns="http://www.w3.org/2000/svg" width="700" height="585" viewBox="0 0 700 585"><rect width="700" height="585" fill="white"/><rect x="25" y="12" width="650" height="60" rx="9" fill="#f5f7fa" stroke="#94a3b8"/><text x="350" y="35" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#263344">Subject / Subject Alternative Name</text><text x="350" y="50" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#263344">Identity associated with the certificate</text><rect x="25" y="92" width="650" height="60" rx="9" fill="#f5f7fa" stroke="#94a3b8"/><text x="350" y="115" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#263344">Issuer</text><text x="350" y="130" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#263344">Certificate authority that issued it</text><rect x="25" y="172" width="650" height="60" rx="9" fill="#f5f7fa" stroke="#94a3b8"/><text x="350" y="195" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#263344">Public key</text><text x="350" y="210" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#263344">RSA, EC or another supported key type</text><rect x="25" y="252" width="650" height="60" rx="9" fill="#f5f7fa" stroke="#94a3b8"/><text x="350" y="275" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#263344">Validity period</text><text x="350" y="290" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#263344">Not Before / Not After</text><rect x="25" y="332" width="650" height="60" rx="9" fill="#f5f7fa" stroke="#94a3b8"/><text x="350" y="355" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#263344">Extensions</text><text x="350" y="370" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#263344">Key Usage, Extended Key Usage and constraints</text><rect x="25" y="412" width="650" height="60" rx="9" fill="#f5f7fa" stroke="#94a3b8"/><text x="350" y="435" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#263344">Serial number</text><text x="350" y="450" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#263344">Certificate identifier</text><rect x="25" y="492" width="650" height="60" rx="9" fill="#f5f7fa" stroke="#94a3b8"/><text x="350" y="515" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#263344">CA digital signature</text><text x="350" y="530" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#263344">Cryptographic protection of the certificate contents</text></svg>