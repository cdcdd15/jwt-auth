<svg xmlns="http://www.w3.org/2000/svg" width="700" height="375" viewBox="0 0 700 375"><rect width="700" height="375" fill="white"/><rect x="25" y="12" width="650" height="60" rx="9" fill="#f5f7fa" stroke="#94a3b8"/><text x="350" y="35" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#263344">Root CA certificate</text><text x="350" y="50" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#263344">Trusted by JVM / enterprise truststore</text><rect x="25" y="92" width="650" height="75" rx="9" fill="#f5f7fa" stroke="#94a3b8"/><text x="350" y="115" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#263344">↓ Signs</text><text x="350" y="130" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#263344">Intermediate CA certificate</text><text x="350" y="145" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#263344">Enterprise or public certificate authority</text><rect x="25" y="187" width="650" height="75" rx="9" fill="#f5f7fa" stroke="#94a3b8"/><text x="350" y="210" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#263344">↓ Signs</text><text x="350" y="225" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#263344">Server X.509 certificate</text><text x="350" y="240" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#263344">Contains server identity and public key</text><rect x="25" y="282" width="650" height="60" rx="9" fill="#f5f7fa" stroke="#94a3b8"/><text x="350" y="305" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#263344">↓ HTTPS endpoint</text><text x="350" y="320" text-anchor="middle" font-family="Arial" font-size="12" font-weight="400" fill="#263344">For example: issuer.example.com</text></svg>